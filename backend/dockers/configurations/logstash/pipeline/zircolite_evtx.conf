input {
  file {
        path => "/opt/data/*.json"
        mode => "read"
        exit_after_read => true
        file_completed_action => "log"
        file_completed_log_path => "/usr/share/logstash/logstash_ingest_completed.log"
        start_position => "beginning"
        sincedb_path => "/dev/null"
        type => "zircolite_evtx"
  }
}

filter {
  if ([type] == "zircolite_evtx") {

    # Parse the JSON into a temporary field to extract values, keep original in [message]
    json {
      source => "message"
      target => "tmp"
      add_tag => ["zircolite"]
    }

    # Set @timestamp from TimeCreated
    date {
      match => [ "[tmp][Event][System][TimeCreated][#attributes][SystemTime]", "ISO8601" ]
      target => "@timestamp"
    }
    # Copy @timestamp to 
    mutate { copy => { "@timestamp" => "SystemTime" }}


    # Extract and map to ECS-compatible fields (winlog namespace and base fields)
    mutate {
      add_field => {
        "[winlog][channel]" => "%{[tmp][Event][System][Channel]}"
        "[winlog][computer_name]" => "%{[tmp][Event][System][Computer]}"
        "[winlog][keywords]" => "%{[tmp][Event][System][Keywords]}"
        "[winlog][opcode]" => "%{[tmp][Event][System][Opcode]}"
        "[winlog][provider_guid]" => "%{[tmp][Event][System][Provider][#attributes][Guid]}"
        "[winlog][provider_name]" => "%{[tmp][Event][System][Provider][#attributes][Name]}"
        "[winlog][record_id]" => "%{[tmp][Event][System][EventRecordID]}"
        "[winlog][task]" => "%{[tmp][Event][System][Task]}"
        "[winlog][version]" => "%{[tmp][Event][System][Version]}"
        "[winlog][process][pid]" => "%{[tmp][Event][System][Execution][#attributes][ProcessID]}"
        "[winlog][process][thread][id]" => "%{[tmp][Event][System][Execution][#attributes][ThreadID]}"
        "[winlog][user][identifier]" => "%{[tmp][Event][System][Security][#attributes][UserID]}"
      }
    }

    if [tmp][Event][System][EventID]{
      if ([tmp][Event][System][EventID][#text]){
        mutate { add_field => {"[winlog][event_id]" => "%{[tmp][Event][System][EventID][#text]}" }}
      } else {
        mutate { add_field => {"[winlog][event_id]" => "%{[tmp][Event][System][EventID]}" }}
      }
    }

    ## Get Bits Data
    if [winlog][channel] == "Microsoft-Windows-Bits-Client/Operational"{
      ## EventID: 59/60
      if [tmp][Event][EventData][name] { mutate { add_field => { "[winlog][bits][name]" => "%{[tmp][Event][EventData][name]}"  }}}
      if [tmp][Event][EventData][url] { mutate { add_field => { "[winlog][bits][url]" => "%{[tmp][Event][EventData][url]}"  }}}
      if [tmp][Event][EventData][fileTime] { mutate { add_field => { "[winlog][bits][file][time]" => "%{[tmp][Event][EventData][fileTime]}"  }}}
      if [tmp][Event][EventData][fileLength] { mutate { add_field => { "[winlog][bits][file][length]" => "%{[tmp][Event][EventData][fileLength]}"  }}}
      if [tmp][Event][EventData][bytesTotal] { mutate { add_field => { "[winlog][bits][bytes][total]" => "%{[tmp][Event][EventData][bytesTotal]}"  }}}
      if [tmp][Event][EventData][bytesTransferred] { mutate { add_field => { "[winlog][bits][bytes][transfered]" => "%{[tmp][Event][EventData][bytesTransferred]}"  }}}
      if [tmp][Event][EventData][bytesTransferredFromPeer] { mutate { add_field => { "[winlog][bits][bytes][frompeer]" => "%{[tmp][Event][EventData][bytesTransferredFromPeer]}"  }}}

      ## ECS - Elastic Common Schema / https://www.elastic.co/docs/reference/ecs/ecs-url
      if [tmp][Event][EventData][url] { mutate { add_field => { "[url][full]" => "%{[tmp][Event][EventData][url]}"  }}}
    }

    ## Get Firewall Data
    if [winlog][provider_name] == "Microsoft-Windows-Windows Firewall With Advanced Security"{
      if [tmp][Event][EventData][RuleId] { mutate { add_field => { "[winlog][firewall][ruleid]" => "%{[tmp][Event][EventData][RuleId]}"  }}}
      if [tmp][Event][EventData][RuleName] { mutate { add_field => { "[winlog][firewall][rulename]" => "%{[tmp][Event][EventData][RuleName]}" }}}
      if [tmp][Event][EventData][ApplicationPath] { mutate { add_field => { "[winlog][firewall][application][path]" => "%{[tmp][Event][EventData][ApplicationPath]}" }}}
      if [tmp][Event][EventData][ServiceName] { mutate { add_field => { "[winlog][firewall][service][name]" => "%{[tmp][Event][EventData][ServiceName]}" }}}
      if [tmp][Event][EventData][Direction] { mutate { add_field => { "[winlog][firewall][direction]" => "%{[tmp][Event][EventData][Direction]}" }}}
      if [tmp][Event][EventData][LocalPorts] { mutate { add_field => { "[winlog][firewall][local][ports]" => "%{[tmp][Event][EventData][LocalPorts]}" }}}
      if [tmp][Event][EventData][LocalAddresses] { mutate { add_field => { "[winlog][firewall][local][addresses]" => "%{[tmp][Event][EventData][LocalAddresses]}" }}}
      if [tmp][Event][EventData][RemotePorts] { mutate { add_field => { "[winlog][firewall][remote][ports]" => "%{[tmp][Event][EventData][RemotePorts]}" }}}
      if [tmp][Event][EventData][RemoteAddresses] { mutate { add_field => { "[winlog][firewall][remote][addresses]" => "%{[tmp][Event][EventData][RemoteAddresses]}" }}}
      if [tmp][Event][EventData][ModifyingUser] { mutate { add_field => { "[winlog][firewall][modifying][user]" => "%{[tmp][Event][EventData][ModifyingUser]}" }}}
      if [tmp][Event][EventData][ModifyingApplication] { mutate { add_field => { "[winlog][firewall][modifying][application]" => "%{[tmp][Event][EventData][ModifyingApplication]}" }}}

      ## ECS - Elastic Common Schema / https://www.elastic.co/docs/reference/ecs/ecs-destination, https://www.elastic.co/docs/reference/ecs/ecs-source
      if [tmp][Event][EventData][LocalAddresses] { mutate { add_field => { "[source][address]" => "%{[tmp][Event][EventData][LocalAddresses]}" }}}
      if [tmp][Event][EventData][LocalPorts] { mutate { add_field => { "[source][port]" => "%{[tmp][Event][EventData][LocalPorts]}" }}}
      if [tmp][Event][EventData][RemoteAddresses] { mutate { add_field => { "[destination][address]" => "%{[tmp][Event][EventData][RemoteAddresses]}" }}}
      if [tmp][Event][EventData][RemotePorts] { mutate { add_field => { "[destination][port]" => "%{[tmp][Event][EventData][RemotePorts]}" }}}
      if [tmp][Event][EventData][ModifyingUser] { mutate { add_field => { "[user][name]" => "%{[tmp][Event][EventData][ModifyingUser]}" }}}
      if [tmp][Event][EventData][ApplicationPath] { mutate { add_field => { "[file][path]" => "%{[tmp][Event][EventData][ApplicationPath]}" }}}
    }


    ## Get Process Data
    if [winlog][provider_name] == "Microsoft-Windows-Security-Auditing" {
      if [winlog][channel] == "Security" {
        if [winlog][event_id] == "4688" {
          mutate { copy => { "[tmp][Event][EventData]" => "[winlog][process]" }}

          ## ECS / Elastic Common Schema / https://www.elastic.co/docs/reference/ecs/ecs-file
          if [tmp][Event][EventData][ParentProcessName] { mutate { add_field => { "[file][path]" => "%{[tmp][Event][EventData][ParentProcessName]}"  }}}
          if [tmp][Event][EventData][NewProcessName]    { mutate { add_field => { "[file][path]" => "%{[tmp][Event][EventData][NewProcessName]}"  }}}

          ## ECS / Elastic Common Schema / https://www.elastic.co/docs/reference/ecs/ecs-user-usage
          if [tmp][Event][EventData][SubjectDomainName] { mutate { add_field => { "[user][domain]" => "%{[tmp][Event][EventData][SubjectDomainName]}"   }}}
          if [tmp][Event][EventData][TargetDomainName] { mutate { add_field => { "[user][domain]" => "%{[tmp][Event][EventData][TargetDomainName]}"   }}}
          if [tmp][Event][EventData][SubjectUserSid]   { mutate { add_field => { "[user][id]" => "%{[tmp][Event][EventData][SubjectUserSid]}"  }}}
          if [tmp][Event][EventData][TargetUserSid]   { mutate { add_field => { "[user][id]" => "%{[tmp][Event][EventData][TargetUserSid]}"  }}}
          if [tmp][Event][EventData][SubjectUserName]   { mutate { add_field => { "[user][name]" => "%{[tmp][Event][EventData][SubjectUserName]}"  }}}
          if [tmp][Event][EventData][TargetUserName]   { mutate { add_field => { "[user][name]" => "%{[tmp][Event][EventData][TargetUserName]}"  }}}

          #if [tmp][Event][EventData][NewProcessId]      { mutate { add_field => { "[winlog][process][servicetype]" => "%{[tmp][Event][EventData][ServiceType]}"  }}}
          #if [tmp][Event][EventData][TokenElevationType]{ mutate { add_field => { "[winlog][process][servicetype]" => "%{[tmp][Event][EventData][ServiceType]}"  }}}
          #if [tmp][Event][EventData][ProcessId]         { mutate { add_field => { "[winlog][process][servicetype]" => "%{[tmp][Event][EventData][ServiceType]}"  }}}
          #if [tmp][Event][EventData][CommandLine]       { mutate { add_field => { "[winlog][process][commandline]" => "%{[tmp][Event][EventData][ServiceType]}"  }}}
          #if [tmp][Event][EventData][SubjectUserSid]    { mutate { add_field => { "[winlog][process][accountname]" => "%{[tmp][Event][EventData][AccountName]}"  }}}
          #if [tmp][Event][EventData][SubjectUserName]   { mutate { add_field => { "[winlog][process][path]" => "%{[tmp][Event][EventData][ImagePath]}"  }}}
          #if [tmp][Event][EventData][SubjectDomainName] { mutate { add_field => { "[winlog][process][name]" => "%{[tmp][Event][EventData][ServiceName]}"   }}}
          #if [tmp][Event][EventData][SubjectLogonId]    { mutate { add_field => { "[winlog][process][servicetype]" => "%{[tmp][Event][EventData][ServiceType]}"  }}}
          #if [tmp][Event][EventData][TargetUserSid]     { mutate { add_field => { "[winlog][process][servicetype]" => "%{[tmp][Event][EventData][ServiceType]}"  }}}
          #if [tmp][Event][EventData][TargetUserName]    { mutate { add_field => { "[winlog][process][servicetype]" => "%{[tmp][Event][EventData][ServiceType]}"  }}}
          #if [tmp][Event][EventData][TargetDomainName]  { mutate { add_field => { "[winlog][process][servicetype]" => "%{[tmp][Event][EventData][ServiceType]}"  }}}
          #if [tmp][Event][EventData][TargetLogonId]     { mutate { add_field => { "[winlog][process][servicetype]" => "%{[tmp][Event][EventData][ServiceType]}"  }}}
        }
      }
    }


    ## Get RDP Data
    if [winlog][channel] == "Microsoft-Windows-TerminalServices-LocalSessionManager/Operational" {
      if [tmp][Event][UserData][EventXML][Address] { mutate { add_field => { "[winlog][rdp][address]" => "%{[tmp][Event][UserData][EventXML][Address]}"  }}}
      if [tmp][Event][UserData][EventXML][User] { mutate { add_field => { "[winlog][rdp][user]" => "%{[tmp][Event][UserData][EventXML][User]}"  }}}
      if [tmp][Event][UserData][EventXML][SessionID] { mutate { add_field => { "[winlog][rdp][sessionid]" => "%{[tmp][Event][UserData][EventXML][SessionID]}"  }}}

      ## ECS - Elastic Common Schema / https://www.elastic.co/docs/reference/ecs/ecs-destination, https://www.elastic.co/docs/reference/ecs/ecs-source
      if [tmp][Event][UserData][EventXML][Address] { mutate { add_field => { "[destination][address]" => "%{[tmp][Event][UserData][EventXML][Address]}" }}}
      if [tmp][Event][UserData][EventXML][User] { mutate { add_field => { "[user][name]" => "%{[tmp][Event][UserData][EventXML][User]}"  }}}

    }

    ## Get Service Data
    if [winlog][provider_name] == "Service Control Manager" {
      if [tmp][Event][EventData][AccountName] { mutate { add_field => { "[winlog][service][accountname]" => "%{[tmp][Event][EventData][AccountName]}"  }}}
      if [tmp][Event][EventData][ImagePath] { mutate { add_field => { "[winlog][service][path]" => "%{[tmp][Event][EventData][ImagePath]}"  }}}
      if [tmp][Event][EventData][ServiceName] { mutate { add_field => { "[winlog][service][name]" => "%{[tmp][Event][EventData][ServiceName]}"   }}}
      if [tmp][Event][EventData][ServiceType] { mutate { add_field => { "[winlog][service][servicetype]" => "%{[tmp][Event][EventData][ServiceType]}"  }}}
    }

    ## Get WMI Data
    if [winlog][channel] == "Microsoft-Windows-WMI-Activity/Operational" {

      ## Operation_StartedOperational / EventID: 5857
      if [tmp][Event][UserData][Operation_StartedOperational][ProcessID] { mutate { add_field => { "[winlog][wmi][process][id]" => "%{[tmp][Event][UserData][Operation_StartedOperational][ProcessID]}"  }}}
      if [tmp][Event][UserData][Operation_StartedOperational][ProviderName] { mutate { add_field => { "[winlog][wmi][provider][name]" => "%{[tmp][Event][UserData][Operation_StartedOperational][ProviderName]}"  }}}
      if [tmp][Event][UserData][Operation_StartedOperational][ProviderPath] { mutate { add_field => { "[winlog][wmi][provider][path]" => "%{[tmp][Event][UserData][Operation_StartedOperational][ProviderPath]}"  }}}
      if [tmp][Event][UserData][Operation_StartedOperational][HostProcess] { mutate { add_field => { "[winlog][wmi][hostprocess]" => "%{[tmp][Event][UserData][Operation_StartedOperational][HostProcess]}"  }}}

      ## Operation_ClientFailure / EVentID: 5858
      if [tmp][Event][UserData][Operation_ClientFailure][ClientMachine] { mutate { add_field => { "[winlog][wmi][client][machine]" => "%{[tmp][Event][UserData][Operation_ClientFailure][ClientMachine]}"  }}}
      if [tmp][Event][UserData][Operation_ClientFailure][ClientProcessId] { mutate { add_field => { "[winlog][wmi][client][Process][id]" => "%{[tmp][Event][UserData][Operation_ClientFailure][ClientProcessId]}"  }}}
      if [tmp][Event][UserData][Operation_ClientFailure][Operation] { mutate { add_field => { "[winlog][wmi][operation]" => "%{[tmp][Event][UserData][Operation_ClientFailure][Operation]}"  }}}
      if [tmp][Event][UserData][Operation_ClientFailure][ResultCode] { mutate { add_field => { "[winlog][wmi][resultcode]" => "%{[tmp][Event][UserData][Operation_ClientFailure][ResultCode]}"  }}}
      if [tmp][Event][UserData][Operation_ClientFailure][User] { mutate { add_field => { "[winlog][wmi][user]" => "%{[tmp][Event][UserData][Operation_ClientFailure][User]}"  }}}
      if [tmp][Event][UserData][Operation_ClientFailure][User] { mutate { add_field => { "[user][name]" => "%{[tmp][Event][UserData][Operation_ClientFailure][User]}"  }}}

      ## Operation_TemporaryEssStarted / EVentID: 5860
      if [tmp][Event][UserData][Operation_TemporaryEssStarted][ClientMachine] { mutate { add_field => { "[winlog][wmi][client][machine]" => "%{[tmp][Event][UserData][Operation_TemporaryEssStarted][ClientMachine]}"  }}}
      if [tmp][Event][UserData][Operation_TemporaryEssStarted][NamespaceName] { mutate { add_field => { "[winlog][wmi][namespace]" => "%{[tmp][Event][UserData][Operation_TemporaryEssStarted][NamespaceName]}"  }}}
      if [tmp][Event][UserData][Operation_TemporaryEssStarted][PossibleCause] { mutate { add_field => { "[winlog][wmi][possiblecause]" => "%{[tmp][Event][UserData][Operation_TemporaryEssStarted][PossibleCause]}"  }}}
      if [tmp][Event][UserData][Operation_TemporaryEssStarted][Processid] { mutate { add_field => { "[winlog][wmi][process][id]" => "%{[tmp][Event][UserData][Operation_TemporaryEssStarted][Processid]}"  }}}
      if [tmp][Event][UserData][Operation_TemporaryEssStarted][Query] { mutate { add_field => { "[winlog][wmi][query]" => "%{[tmp][Event][UserData][Operation_TemporaryEssStarted][Query]}"  }}}
      if [tmp][Event][UserData][Operation_TemporaryEssStarted][User] { mutate { add_field => { "[winlog][wmi][user]" => "%{[tmp][Event][UserData][Operation_TemporaryEssStarted][User]}"  }}}

      ## Operation_ESStoConsumerBinding / EVentID: 5861
      if [tmp][Event][UserData][Operation_ESStoConsumerBinding][Namespace] { mutate { add_field => { "[winlog][wmi][namespace]" => "%{[tmp][Event][UserData][Operation_ESStoConsumerBinding][Namespace]}"  }}}
      if [tmp][Event][UserData][Operation_ESStoConsumerBinding][CONSUMER] { mutate { add_field => { "[winlog][wmi][consumer]" => "%{[tmp][Event][UserData][Operation_ESStoConsumerBinding][CONSUMER]}"  }}}
      if [tmp][Event][UserData][Operation_ESStoConsumerBinding][ESS] { mutate { add_field => { "[winlog][wmi][ess]" => "%{[tmp][Event][UserData][Operation_ESStoConsumerBinding][ESS]}"  }}}
      if [tmp][Event][UserData][Operation_ESStoConsumerBinding][PossibleCause] { mutate { add_field => { "[winlog][wmi][possiblecause]" => "%{[tmp][Event][UserData][Operation_ESStoConsumerBinding][PossibleCause]}"  }}}

    }

    # Add base ECS fields
    mutate {
      add_field => {
        "[event][kind]" => "windows_event"
        "[event][category]" => ["configuration"]
        "[event][module]" => "windows"
        "[host][name]" => "%{[computer_name]}"
      }
    }

    if [winlog][user][identifier] { mutate { copy => { "[winlog][user][identifier]"  => "[user][id]"  }}}
    if [tmp][Event][EventData][UserSid] { mutate { add_field => { "[user][id]" => "%{[tmp][Event][EventData][UserSid]}"  }}}
    if [tmp][Event][System][Security][UserID] { mutate { add_field => { "[user][id]" => "%{[tmp][Event][System][Security][#attributes][UserID]}"  }}}
    if [winlog][user][name] { mutate { copy => { "[winlog][user][name]" => "[user][name]"   }}}
    if [tmp][Event][EventData][Username] { mutate { add_field => { "[user][name]" => "%{[tmp][Event][EventData][Username]}"  }}}

    # Remove tmp nested field
    mutate { remove_field => ["tmp"]}

    # Blacklist all tmp fields
    prune { blacklist_names => [ "^tmp" ] }
  }
}


output {
  if ([type] == "zircolite_evtx") {
    elasticsearch {
      hosts => ["elasticsearch:9200"] 
      index => "zircolite_evtx"
    }
  }
}
