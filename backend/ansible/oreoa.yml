---
- name: OREOA
  hosts: all
  become: yes

  vars:
      toolsDir: "oreoa_deployed"
      timesketchDir: "../../{{ toolsDir }}/timesketch"
      yaraDir: "../../{{ toolsDir }}/yara"
      keepass_db_path: "../../{{toolsDir}}/oreoa.kdbx"
      keepass_db_password: "oreoa"

  tasks: 
   - name: create directory if they don't exist
     file:
       path: "{{ item }}"
       state: directory
       owner: "{{ ansible_user }}"
       group: "{{ ansible_user }}"
       mode: 0775
     loop:
       - "../../{{ toolsDir }}"

   - include_tasks: tasks/init_env.yml
   - include_tasks: tasks/docker.yml
   - include_tasks: tasks/keepassXC_create_db.yml
   - include_tasks: tasks/elk.yml
   - include_tasks: tasks/timesketch.yml
   - include_tasks: tasks/yara.yml

   - include_tasks: tasks/chainsaw.yml
   - include_tasks: tasks/clamav.yml
   - include_tasks: tasks/hayabusa.yml
   - include_tasks: tasks/plaso.yml
   - include_tasks: tasks/regrippy.yml
   - include_tasks: tasks/takajo.yml
   - include_tasks: tasks/zircolite.yml
