- name: "Timesketch | Check if folder exists"
  stat:
    path: "{{ timesketchDir }}"
  register: timesketchDirectory
  when: arch == "amd64"

## Remove previous installation
- name: "Timesketch | Stop and remove old containers"
  docker_container:
    name: "{{ item }}"
    state: absent
    restart_policy: no
  loop:
    - "timesketch-web"
    - "timesketch-web-legacy"
    - "timesketch-worker"
    - "opensearch"
    - "postgres"
    - "redis"
    - "nginx"
  when: 
    - arch == "amd64"
    - timesketchDirectory.stat.exists
  ignore_errors: True

- name: "Timesketch | Remove old folder"
  file:
    path: "{{ timesketchDir }}"
    state: absent
  when: 
    - arch == "amd64"
    - timesketchDirectory.stat.exists
  ignore_errors: True

- name: "Timesketch | Create folder"
  become_user: "{{ ansible_user }}"
  file:
    path: "{{ timesketchDir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: 
    - arch == "amd64"

- name: "Timesketch | Download setup script"
  become_user: "{{ ansible_user }}"
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/google/timesketch/master/contrib/deploy_timesketch.sh
    dest: "{{ timesketchDir }}/deploy_timesketch.sh"
    mode: 0755 
  when: 
    - arch == "amd64"

- name: "Timesketch | Execute deploy script"
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell: cd {{ timesketchDir }}; yes N | sudo ./deploy_timesketch.sh;
  when: 
    - arch == "amd64"

- name: "Timesketch | Change ownership"
  ansible.builtin.file:
    state: directory
    path: "{{ timesketchDir }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: yes
  when: 
    - arch == "amd64"

- name: "Timesketch | modify memory usage"
  become_user: "{{ ansible_user }}"
  lineinfile:
    dest: "{{ timesketchDir }}/timesketch/config.env"
    line: 'OPENSEARCH_MEM_USE_GB=4'
    regexp: "^OPENSEARCH_MEM_USE_GB="
  when: 
    - arch == "amd64"

- name: "Timesketch | modify HTTPS TCP Port"
  become_user: "{{ ansible_user }}"
  lineinfile:
    dest: "{{ timesketchDir }}/timesketch/config.env"
    line: 'NGINX_HTTPS_PORT=5443'
    regexp: "^NGINX_HTTPS_PORT="
  when: 
    - arch == "amd64"

- name: "Timesketch | modify HTTP TCP Port"
  become_user: "{{ ansible_user }}"
  lineinfile:
    dest: "{{ timesketchDir }}/timesketch/config.env"
    line: 'NGINX_HTTP_PORT=5080'
    regexp: "^NGINX_HTTP_PORT="
  when: 
    - arch == "amd64"

- name: "Timesketch | Increase the CSRF token time limit"
  become_user: "{{ ansible_user }}"
  lineinfile:
    dest: "{{ timesketchDir }}/timesketch/etc/timesketch/timesketch.conf"
    line: 'WTF_CSRF_TIME_LIMIT = 3600'
    regexp: "^WTF_CSRF_TIME_LIMIT ="
  when: 
    - arch == "amd64"

- name: "Timesketch | Download tags file"
  become_user: "{{ ansible_user }}"
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/kidrek/AllthingsTimesketch/refs/heads/master/tags.yaml
    dest: "{{ timesketchDir }}/timesketch/etc/timesketch/tags.yaml"
    mode: 0644
    force: true
  when: 
    - arch == "amd64"

- name: "Timesketch | Start docker"
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell: cd {{ timesketchDir }}/timesketch; sudo docker-compose up -d;
  when: 
    - arch == "amd64"

- name: "Timesketch | Check if container is running"
  wait_for:
    host: "127.0.0.1"
    port: 5080
  when: 
    - arch == "amd64"

- name: "Timesketch | Start all containers"
  docker_container:
    name: "{{ item }}"
    state: started
    restart: yes
    restart_policy: no
  loop:
    - "timesketch-web"
    - "timesketch-web-legacy"
    - "timesketch-worker"
    - "opensearch"
    - "postgres"
    - "redis"
    - "nginx"
  when: 
    - arch == "amd64"

