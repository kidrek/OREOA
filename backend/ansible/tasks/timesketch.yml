## Timesketch Configuration
### Generate password
- include_tasks: tasks/keepassXC_generate_password.yml

### Add Timesketch entry in keepassXC
- name: "Timesketch | Remove old Entry in keepassXC"
  become_user: "{{ ansible_user }}"
  shell: "printf \"%s\" {{ keepass_db_password }} | keepassxc-cli rm {{ keepass_db_path }} timesketch"
  delegate_to: localhost
  register: result
  ignore_errors: True

- name: "Timesketch | Remove old Entry in recycle keepassXC"
  become_user: "{{ ansible_user }}"
  shell: "printf \"%s\" {{ keepass_db_password }} | keepassxc-cli rm {{ keepass_db_path }} timesketch"
  delegate_to: localhost
  register: result
  ignore_errors: True

- name: "Timesketch | Add Entry in keepassXC"
  become_user: "{{ ansible_user }}"
  shell: "printf \"%s\n%s\" {{ keepass_db_password }} {{ password }} | keepassxc-cli add --url 'http://127.0.0.1:5080/' -u '{{ ansible_user }}' -p {{ keepass_db_path }} timesketch"
  delegate_to: localhost
  register: result
  ignore_errors: False

- name: "Timesketch | Set environment variables"
  become_user: "{{ ansible_user }}"
  lineinfile:
    dest: "../../.env"
    line: "{{ item.name }}={{ item.value }}"
    regexp: "^{{ item.name }}="
  loop:
      - { name: "timesketch_user", value: "\"{{ ansible_user }}\"" }
      - { name: "timesketch_password", value: "\"{{ password }}\"" }
      - { name: "timesketch_upload_path", value: "\"./{{ toolsDir }}/timesketch/timesketch/upload\"" }
      - { name: "timesketch_sketch_id", value: "1"}
  when: 
    - arch == "amd64"

- name: "Timesketch | Create user"
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell: sleep 30; cd {{ timesketchDir }}/timesketch; sudo docker-compose exec timesketch-web tsctl create-user {{ ansible_user }} --password {{ password }};
  when: 
    - arch == "amd64"

