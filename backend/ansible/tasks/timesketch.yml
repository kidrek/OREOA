- name: "Timesketch | timesketch-import-client python module installation"
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell: cd {{ timesketchDir }}/timesketch; sudo docker-compose exec timesketch-worker bash -c "pip3 install timesketch-import-client"
  when: 
    - arch == "amd64"

- name: "Timesketch | remove old timesketch session handle"
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell: cd {{ timesketchDir }}/timesketch; sudo docker-compose exec timesketch-worker bash -c "rm -f /root/.timesketchrc; rm -f /root/.timesketch.token"
  when: 
    - arch == "amd64"

- name: "Timesketch | Stop a container"
  docker_container:
    name: "{{ item }}"
    state: stopped
    restart_policy: no
  loop:
    - "timesketch-web"
    - "timesketch-web-legacy"
    - "timesketch-worker"
    - "opensearch"
    - "postgres"
    - "redis"
    - "nginx"
  when: 
    - arch == "amd64"

