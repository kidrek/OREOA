- name: "Plaso - Stop ands remove old container"
  docker_container:
    name: "plaso"
    state: absent
    restart_policy: no
  ignore_errors: True

- name: Plaso - Build image
  community.docker.docker_image:
    name: plaso
    build:
      path: ../
      dockerfile: dockers/plaso_dockerfile
      nocache: true
    source: build
    state: present

- name: Plaso - Build image container
  community.docker.docker_container:
    name: plaso
    image: plaso
    recreate: true
    restart: no
    restart_policy: "no"
    state: "stopped"
